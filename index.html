/* Group-assignment roster support */
.group-roster{padding:18px 22px;margin-bottom:16px}
.group-roster-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:11px}
.group-roster h3{font-size:15px;margin:0}.group-roster p{font-size:12px;color:var(--muted);margin:0}
.roster-table{width:100%;border-collapse:collapse;text-align:left}.roster-table th{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:#6c7890;background:#f6f8fb}
.roster-table td,.roster-table th{padding:9px 12px;border-bottom:1px solid var(--line)}.roster-table tr:last-child td{border-bottom:0}
.roster-table td:first-child{width:43px;color:var(--muted)}
.member-stack{display:flex;flex-direction:column;gap:2px}.member-stack small{color:var(--muted);font-size:11px}
.group-list-members{font-size:12px;color:#52617b;margin-top:5px;line-height:1.6}
.print-roster{width:100%;margin-top:3mm}
@media(max-width:470px){.group-roster{padding:16px}.roster-table td,.roster-table th{padding:8px}}

/* Assignment-to-course percentage conversion UI */
.score-box .score-caption{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.score-box .course-result{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.score-box .course-result>span{font-size:12px;color:var(--muted);font-weight:700}
.score-box .course-result strong{font-size:21px;color:var(--orange);white-space:nowrap}
.score-box .course-result small{font-size:14px;color:#768398}

.sidebar{height:100vh;height:100dvh}

@media (hover:none){
 .btn:hover:not(:disabled),.scale-option:hover{transform:none}

 .mmb-info{flex:1;min-width:0;text-align:center}.mmb-info strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mmb-info span{font-size:11px;color:var(--muted)}

 .stats-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
/* Phone */

 .brand,.nav-caption,.sidebar-bottom{display:none!important}
 #navigation{display:flex;width:100%;gap:2px}
 .nav-link{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:7px 2px;margin:0;border-radius:10px;min-height:52px;width:auto}
 .nav-link svg{width:20px;height:20px}
 .nav-link span.nav-full{display:none!important}.nav-link span.nav-short{display:block!important;font-size:10.5px;font-weight:700;line-height:1}
 .topbar{padding:14px 16px 12px;gap:10px}.topbar h1{font-size:20px;margin:0}.topbar p{display:none}
 .cloud-toolbar{gap:7px}.cloud-status{font-size:10.5px;padding:6px 9px}
 #cloud-save-now{min-height:34px;padding:6px 10px;font-size:12px}
 .top-actions .btn{min-height:38px;padding:8px 11px;font-size:12px}
 .container{padding:14px 12px 28px}
 .control,select.control,textarea.control{font-size:16px} /* stops iOS zooming into fields */
 .btn{min-height:42px}.btn.small{min-height:36px}
 .hero{padding:20px;border-radius:16px}.hero h2{font-size:21px}
 .metric-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{padding:14px}.metric-number{font-size:24px}
 .mark-top{padding:14px}.mark-head-actions{width:100%}.mark-head-actions select{width:100%!important}
 .mark-head-actions .btn{flex:1 1 auto}
 .grading-summary{padding:16px;flex-direction:column;align-items:stretch;gap:10px}
 .score-box{text-align:left}.grade-line,.score-box .course-result{justify-content:flex-start}
 .question-card{padding:14px}.question-top{flex-direction:column;gap:6px}
 .rating-grid{grid-template-columns:1fr!important;gap:8px}
 .rating{display:grid;grid-template-columns:50px 1fr;grid-template-areas:"score label" "score pct" "score desc";column-gap:10px;row-gap:1px;min-height:0;padding:10px 12px;align-items:start}
 .rating .rating-score{grid-area:score;margin:0!important;font-size:24px!important;align-self:center;text-align:center}
 .rating .rating-score span{display:block}

 .rating .rating-pct{grid-area:pct}

 .feedback{padding:16px}
 .nav-bottom{flex-direction:column;align-items:stretch}.nav-bottom .stack-actions{width:100%}.nav-bottom .btn{flex:1}
 .result-top{padding:16px}.result-top .stack-actions,.result-top select{width:100%!important}

 .data-table,.data-table tbody,.data-table tr,.data-table td{display:block;width:100%}
 .data-table tr{border-bottom:1px solid var(--line);padding:10px 14px}

 .data-table td .tiny-note,.data-table td>div{text-align:right}.data-table td.row-action::before{content:none}

@media (min-width:721px) and (max-width:1024px){

@media print{.mobile-mark-bar,.sidebar{display:none!important}}

/* ===== v3.4: guided flow ===== */
.flow-card{padding:20px 22px;margin:18px 0 4px}
.flow-card.compact{padding:12px 14px;margin:0 0 14px}
.flow-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.flow-head h2{font-size:18px;margin:0 0 3px;letter-spacing:-.4px}.flow-head p{margin:0;color:var(--muted);font-size:13px}
.flow-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;counter-reset:none}
.flow-step{position:relative;min-width:0}
.flow-step:not(:last-child)::after{content:'';position:absolute;top:19px;left:calc(50% + 20px);right:calc(-50% + 20px);height:2px;background:#e3e9f2;z-index:0}
.flow-step.done:not(:last-child)::after{background:#8fd3b2}
.flow-step button{position:relative;z-index:1;width:100%;border:0;background:none;padding:2px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border-radius:12px;color:var(--ink)}
.flow-step button:hover{background:#f6f8fc}
.flow-dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:#fff;border:2px solid #d9e1ec;color:#7a889d;transition:.15s}
.flow-step.done .flow-dot{background:#1b986c;border-color:#1b986c;color:#fff}
.flow-step.current .flow-dot{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 0 0 5px #ffe5da}
.flow-text strong{display:block;font-size:12.5px;line-height:1.2}.flow-text small{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.flow-step.current .flow-text strong{color:var(--orange)}
.compact .flow-dot{width:28px;height:28px;font-size:12px}.compact .flow-step:not(:last-child)::after{top:15px;left:calc(50% + 16px);right:calc(-50% + 16px)}
.compact .flow-step.current .flow-dot{box-shadow:0 0 0 4px #ffe5da}.compact .flow-text strong{font-size:11.5px}.compact .flow-text small{font-size:10.5px}
.flow-next{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;padding:15px 17px;border-radius:14px;background:linear-gradient(90deg,#fff5f0,#fffaf7);border:1px solid #ffdccb}
.flow-next.all-done{background:#effaf4;border-color:#c5ead6}
.flow-next strong{display:block;font-size:16px;margin:3px 0 2px;letter-spacing:-.3px}.flow-next p{margin:0;font-size:12.5px;color:var(--muted)}
.flow-next-inline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.flow-next-inline strong{color:var(--ink)}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.quick-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fbfcfe;border-radius:12px;padding:13px 14px;font-weight:700;font-size:13px;text-align:left;color:var(--ink);min-height:52px}
.quick-btn svg{color:var(--orange);flex:none}.quick-btn:hover{border-color:#f2a184;background:#fff8f4}
.done-notice{background:#effaf4;border-color:#c5ead6;color:#1d6a45;align-items:center;flex-wrap:wrap}
.done-notice>span{flex:1;min-width:180px}.done-notice .btn{margin-left:auto}
.question-card.needs-mark{border-left:4px solid #f3b79f}
.question-card.is-marked{border-left:4px solid #8fd3b2}
.needs-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:#fff0e9;color:#ba5c33;font-size:9.5px;letter-spacing:.6px}
@media(max-width:1024px){.flow-text small{display:none}.compact .flow-text strong{font-size:10.5px}}
@media(max-width:720px){
 .flow-card{padding:14px}.flow-steps{gap:2px}
 .flow-dot{width:30px;height:30px;font-size:12px}.flow-step:not(:last-child)::after{top:15px;left:calc(50% + 16px);right:calc(-50% + 16px)}
 .flow-text strong{font-size:10px;font-weight:700}
 .compact .flow-text{display:none}.compact .flow-step.current .flow-text{display:none}
 .flow-next{flex-direction:column;align-items:stretch}.flow-next .btn{width:100%}
 .quick-grid{grid-template-columns:1fr 1fr}.quick-btn{padding:11px;font-size:12px}
}

/* ===== v3.5: custom logo ===== */
.brand-mark.has-logo{background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:4px;overflow:hidden}
.brand-mark.has-logo img{width:100%;height:100%;object-fit:contain;display:block}


/* ===== v3.6: lighter type, refined cards, motion ===== */
body{font-feature-settings:"kern" 1;text-rendering:optimizeLegibility}
h1,h2,h3,h4,strong,b{font-weight:600}
.topbar h1,.hero h2,.metric-number,.big-score,.flow-next strong,.brand-title{font-weight:700}
.brand-title{letter-spacing:-.2px}.topbar h1{letter-spacing:-.5px}.hero h2{letter-spacing:-.4px}
.btn,.nav-link,.pill,.chip,.eyebrow,.caps,.field label,.field-label,.question-index,.max-chip,.data-table th{font-weight:600}
.eyebrow,.caps,.question-index{letter-spacing:1.2px}
.rating .rating-label,.rating .rating-score{font-weight:600}.rating[data-score] .rating-score{font-weight:700}
.grade-badge{font-weight:700}

/* Tone palette (shared by levels, descriptors, gallery) */
[data-tone="0"],.tone-0{--tone:#ad2945;--tone-bg:#fff0f2}
[data-tone="1"],.tone-1{--tone:#b34b24;--tone-bg:#fff1e9}
[data-tone="2"],.tone-2{--tone:#916000;--tone-bg:#fff8df}
[data-tone="3"],.tone-3{--tone:#315db0;--tone-bg:#edf3ff}
[data-tone="4"],.tone-4{--tone:#087681;--tone-bg:#e9f9f9}
[data-tone="5"],.tone-5{--tone:#16734a;--tone-bg:#eaf9ef}
.tone-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tone,#9aa7b9);margin-right:7px;vertical-align:middle;flex:none}

/* Cards: softer depth + hover lift */
.card{transition:box-shadow .25s ease,transform .25s ease,border-color .25s ease}
.hover-lift:hover,.gallery-card:hover,.criterion-editor:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(20,33,58,.10)}

/* Rubric Library — template list */
.template-list{padding:16px}
.template-list h3{font-size:14px;display:flex;justify-content:space-between;align-items:center}
.template-choice{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;margin-bottom:9px;position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease}
.template-choice::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange);transform:scaleY(0);transform-origin:center;transition:transform .25s ease}
.template-choice:hover{transform:translateX(3px);border-color:#f2c3b1;box-shadow:0 8px 20px rgba(20,33,58,.07);background:#fff}
.template-choice.selected{background:linear-gradient(90deg,#fff4ee,#fff);border-color:#ffcdb8;box-shadow:0 8px 22px rgba(234,105,73,.12)}
.template-choice.selected::before{transform:scaleY(1)}
.template-choice>svg{margin-left:auto;flex:none;transition:transform .2s ease}.template-choice:hover>svg{transform:translateX(3px)}
.tpl-badge{flex:0 0 40px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--tone);background:var(--tone-bg);letter-spacing:.3px}
.tpl-body{min-width:0;flex:1}.tpl-body strong{display:block;font-size:13px;font-weight:600;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-chips{display:flex!important;flex-wrap:wrap;gap:4px;margin-top:5px!important}
.tpl-chips span{font-size:10.5px;font-weight:600;color:#5e6e86;background:#f1f4f9;border-radius:6px;padding:2px 6px;margin:0!important;display:inline!important}
.tpl-chips span.ok{color:#187951;background:var(--greenbg)}.tpl-chips span.bad{color:#b94949;background:#fff0f0}

/* Rubric Library — editor */
.editor-header{position:relative}
.editor-header::after{content:'';position:absolute;left:24px;right:24px;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--orange),#f7b49d 40%,transparent);border-radius:2px}
.level-editor{border:1px solid var(--line);border-top:4px solid var(--tone,#d9e1ec);background:linear-gradient(180deg,var(--tone-bg,#fafbfd),#fff 70%);border-radius:12px;transition:transform .2s ease,box-shadow .2s ease}
.level-editor:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,33,58,.07)}
.level-editor label{color:var(--tone,#43526a)!important}
.criterion-editor{border-radius:16px;border-left:4px solid #f3b79f;transition:transform .25s ease,box-shadow .25s ease}
.criterion-index>div:last-child{display:flex;flex-direction:column;gap:5px}
.crit-weight{display:flex;align-items:center;gap:8px}.crit-weight small{font-size:11px;font-weight:600;color:var(--muted)}
.crit-weight-bar,.total-bar{width:120px;height:6px;background:#edf1f7;border-radius:6px;overflow:hidden}
.crit-weight-bar>div,.total-bar>div{height:100%;background:linear-gradient(90deg,#f7a184,var(--orange));border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.total-bar{width:min(320px,100%);height:8px;margin-top:9px}
.total-bar.ok>div{background:linear-gradient(90deg,#5cc596,#1b986c)}.total-bar.over>div{background:#d85151}
.descriptor{border-radius:10px}
.descriptor label{display:flex;align-items:center;color:var(--tone,#69768c)!important}
.descriptor textarea{border-top:3px solid var(--tone,#d6deea)!important;transition:box-shadow .15s ease,border-color .15s ease}
.descriptor textarea:focus{box-shadow:0 0 0 3px var(--tone-bg)!important}
.index-bubble{background:#fff0e9;color:var(--orange);font-weight:700}

/* Gallery */
.gallery-card{border-radius:16px;background:#fff;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.gallery-card:hover{border-color:#f2c3b1}
.gallery-card.just-added{border-color:#8fd3b2;box-shadow:0 0 0 3px #dff5ea}
.weight-stack{display:flex;height:7px;border-radius:7px;overflow:hidden;gap:2px;margin:2px 0 10px}
.weight-stack span{background:var(--tone);opacity:.85}
.gallery-card li span{display:flex;align-items:center}
.pill.tag-presentation{background:#edf3ff;color:#244789}.pill.tag-written{background:#fff8df;color:#755000}.pill.tag-project{background:#fff1e9;color:#88391d}.pill.tag-visual{background:#e9f9f9;color:#095f68}.pill.tag-individual{background:#eaf9ef;color:#11593a}
.btn.added{color:#187951;border-color:#bfe6cf}

/* Grades & status */
.grade-badge{background:#183353}
.grade-badge.st-excellent{background:#16734a}.grade-badge.st-credit{background:#315db0}.grade-badge.st-pass{background:#916000}.grade-badge.st-fail{background:#ad2945}
.grade-meta{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600}
.grade-line .grade-meta{display:inline;margin:0 0 0 6px}
.dist-bar>div.st-excellent{background:#16734a}.dist-bar>div.st-credit{background:#315db0}.dist-bar>div.st-pass{background:#c08a14}.dist-bar>div.st-fail{background:#ad2945}
.status-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;background:#f1f4f9;color:#4b5a72}
.status-pill b{font-weight:700}
.status-pill.st-excellent{background:#eaf9ef;color:#11593a}.status-pill.st-credit{background:#edf3ff;color:#244789}.status-pill.st-pass{background:#fff8df;color:#755000}.status-pill.st-fail{background:#fff0f2;color:#852036}
.grade-table .range-cell{white-space:nowrap;font-size:12px;color:var(--muted);font-weight:600}.grade-table .range-cell .grade-badge{min-width:30px;margin-right:7px;font-size:11.5px;padding:2px 7px}
.grade-table .control{min-height:34px;padding:6px 8px}.grade-table .control.numeric{max-width:76px}
.settings-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}

/* Motion: page entrance, modal, toast, press */
@keyframes rsRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rsFade{from{opacity:0}to{opacity:1}}
@keyframes rsPop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes rsSlideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.animate-in>*,.animate-in .templates-layout>*,.animate-in .two-col>*,.animate-in .metric-grid>*,.animate-in .backup-grid>*,.animate-in .settings-grid>*{animation:rsRise .5s cubic-bezier(.2,.8,.2,1) both}
.animate-in>*:nth-child(2){animation-delay:.06s}.animate-in>*:nth-child(3){animation-delay:.12s}.animate-in>*:nth-child(4){animation-delay:.18s}.animate-in>*:nth-child(5){animation-delay:.24s}
.animate-in .metric-grid>*:nth-child(2),.animate-in .two-col>*:nth-child(2),.animate-in .templates-layout>*:nth-child(2),.animate-in .backup-grid>*:nth-child(2),.animate-in .settings-grid>*:nth-child(2){animation-delay:.08s}
.animate-in .metric-grid>*:nth-child(3),.animate-in .backup-grid>*:nth-child(3){animation-delay:.14s}.animate-in .metric-grid>*:nth-child(4),.animate-in .backup-grid>*:nth-child(4){animation-delay:.2s}
.animate-in .template-choice{animation:rsSlideIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.1s + var(--i,0)*45ms)}
.animate-in .criterion-editor,.animate-in .level-editor{animation:rsRise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.15s + var(--i,0)*55ms)}
.gallery-card{animation:rsRise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.modal-overlay{animation:rsFade .2s ease both}.modal{animation:rsPop .3s cubic-bezier(.2,.8,.2,1) both}
.toast{animation:rsRise .3s cubic-bezier(.2,.8,.2,1) both}
.btn:active:not(:disabled),.quick-btn:active,.template-choice:active,.rating:active:not(:disabled){transform:scale(.98)}
.rating.selected{animation:rsPopSel .28s ease}
@keyframes rsPopSel{0%{transform:scale(.96)}60%{transform:scale(1.02) translateY(-2px)}100%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:1024px){.template-choice:hover{transform:none}.tpl-body strong{white-space:normal}}
@media (max-width:720px){.settings-grid{grid-template-columns:1fr}.grade-table th:nth-child(1),.grade-table td:nth-child(1){display:none}.crit-weight-bar{width:80px}}

/* v3.6 fixes */

<script>
/* Rubric Studio — standalone (Vercel) edition.
   Replaces the Google Apps Script backend with storage in this browser (localStorage).
   Nothing is uploaded: rubrics, class lists and marks stay on this device. */
(function(){
 var KEY='rubric-studio-workspace-v3', memory=null, storageOk=true;
 function read(){try{var raw=localStorage.getItem(KEY);return raw?JSON.parse(raw):null}catch(e){storageOk=false;return memory}}
 function write(rec){try{localStorage.setItem(KEY,JSON.stringify(rec))}catch(e){if(e&&(e.name==='QuotaExceededError'||e.code===22))throw new Error('Browser storage is full. Export a backup, then delete old assessments.');storageOk=false;memory=rec}}
 var server={
  loadAppState:function(){var rec=read();return {json:rec?rec.json:null,revision:rec?rec.revision:0,sheetUrl:'',recovered:false,userEmail:'',sharedWith:0,storageOk:storageOk}},
  saveAppState:function(p){var rec=read()||{revision:0};if(Number(p.expectedRevision)!==Number(rec.revision||0))throw new Error('CONFLICT: This workspace was changed in another tab.');var next={revision:(rec.revision||0)+1,json:p.json,savedAt:new Date().toISOString()};write(next);return {revision:next.revision,savedAt:next.savedAt}}
 };
 function runner(){var ok=function(){},fail=function(){};var api={withSuccessHandler:function(f){ok=f;return api},withFailureHandler:function(f){fail=f;return api}};
  Object.keys(server).forEach(function(k){api[k]=function(arg){setTimeout(function(){try{ok(server[k](arg))}catch(e){fail(e)}},0)}});return api}
 window.google={script:{get run(){return runner()}}};
 window.RS_STORAGE_KEY=KEY;window.RS_STORAGE_OK=function(){return storageOk};
})();

</script>

const SCALE_MIN=1, SCALE_MAX=5, HISTORIC_SCALE_MAX=10; // Preserve pre-update saved rubrics without changing recorded marks.
function scaleLabels(maxScore){
 if(DEFAULT_LEVEL_LABELS[maxScore])return DEFAULT_LEVEL_LABELS[maxScore];
 const buckets=['Not demonstrated','Very limited','Limited','Developing','Basic','Satisfactory','Competent','Good','Very good','Excellent','Outstanding'];
 return Array.from({length:maxScore+1},(_,score)=>score===0?'Not demonstrated':score===maxScore?'Excellent':buckets[Math.max(1,Math.min(9,Math.round(score/maxScore*9)))]);

function migrateRubric(old){

 let sorted=(Array.isArray(old.levels)?old.levels:[]).slice().sort((a,b)=>Number(b.pct)-Number(a.pct));
 for(let i=0;i<sorted.length;i++){const oldLevel=sorted[i];const direct={'excellent':5,'good':4,'satisfactory':3,'developing':2,'not demonstrated':0};let mapped=direct[String(oldLevel.label||'').toLowerCase()];if(mapped===undefined)mapped=Math.max(0,Math.min(5,Math.round(Number(oldLevel.pct||0)/20)));mapping[oldLevel.id]=mapped}
 const original=(old.criteria||[]),raw=original.map(c=>Math.max(0,Number(c.weight??c.max)||0)),sum=raw.reduce((a,b)=>a+b,0);let running=0;

  let descriptors={};for(const lv of levels){const oldLevel=(old.levels||[]).find(x=>mapping[x.id]===lv.score);descriptors[lv.id]=oldLevel?String(c.descriptors?.[oldLevel.id]||''):(lv.score===1?'Very limited evidence shown.':'')}
  return {id:c.id||id(),title:String(c.title||'Criterion'),weight,guidance:String(c.guidance||''),descriptors};});
 return {rubric:{...clone(old),levels,criteria},levelMap:Object.fromEntries((old.levels||[]).map(l=>[l.id,levels.find(n=>n.score===mapping[l.id])?.id||levels[0].id]))};
}

function setCloudStatus(text,kind='pending'){const el=document.getElementById('cloud-status');if(!el)return;el.className='cloud-status '+kind;el.textContent=text}
function save(){
 if(!cloudReady)return;

}
function flushCloudSave(){
 clearTimeout(cloudDebounce);
 if(!cloudReady||cloudBlocked||cloudBusy||!cloudDirty)return;
 const snapshot=JSON.stringify(state), expectedRevision=cloudRevision;
 let overview=null,overviewKey='';try{let rows=overviewRows();overviewKey=JSON.stringify(rows);if(overviewKey!==lastOverviewSent)overview=rows}catch(e){console.warn('Overview not generated',e)}

 setCloudStatus('Saving…','syncing');
 google.script.run.withSuccessHandler(result=>{
   cloudBusy=false; cloudRevision=result.revision; if(overview)lastOverviewSent=overviewKey;
   cloudDirty=cloudDirty||JSON.stringify(state)!==snapshot;
   if(cloudDirty){setCloudStatus('More changes to save…','pending');cloudDebounce=setTimeout(flushCloudSave,400)}
   else setCloudStatus('Saved in this browser','saved');
 }).withFailureHandler(error=>{
   cloudBusy=false;cloudDirty=true;
   const message=String(error&&error.message||error||'Unknown error');
   if(message.includes('CONFLICT:')){
     cloudBlocked=true;setCloudStatus('Save conflict — export backup','error');
     alert('Another browser or tab updated these marks. This tab will NOT overwrite those changes. Export a JSON backup from Settings & Backup, then reload the page to get the latest version.');
   }else{
     setCloudStatus('Save failed — click Save now to retry','error');
     console.error('Cloud save failed',error);
   }
 }).saveAppState({json:snapshot,expectedRevision,overview});
}

     if(data&&data.error)throw Error(data.error);
     if(data.json){
       const loaded=JSON.parse(data.json);
       if(isLegacyState(loaded))state=migrateState(loaded);
       else if(isState(loaded))state=loaded;
       else throw Error('The saved data format is not recognised. Export your underlying spreadsheet before making changes.');
     }else state=newLecturerState();

     cloudReady=true;

     if(!data.json)save();

       setCloudStatus('Recovered previous saved version — review marks','error');
       alert('The latest saved snapshot could not be opened. The previous complete version was recovered. Please review all scores and export a backup before continuing.');
     }else setCloudStatus('Saved in this browser','saved');

 };

 const boot=window.__RS_BOOT__;window.__RS_BOOT__=null;

}

function flowStepper(a,compact){
 const steps=flowSteps(a),cur=steps.findIndex(x=>!x.done),next=cur<0?null:steps[cur];
 const strip=`<ol class="flow-steps" aria-label="Progress">${steps.map((x,i)=>`<li class="flow-step ${x.done?'done':i===cur?'current':''}" ${i===cur?'aria-current="step"':''}><button type="button" data-action="${x.action}" title="${html(x.cta)}"><span class="flow-dot">${x.done?icon('check',14):i+1}</span><span class="flow-text"><strong>${x.label}</strong><small>${html(x.hint)}</small></span></button></li>`).join('')}</ol>`;
 const nextBox=next?`<div class="flow-next"><div><span class="caps">Next step · ${cur+1} of ${steps.length}</span><strong>${html(next.cta)}</strong><p>${html(next.why)}</p></div><button class="btn primary" data-action="${next.action}">${html(next.cta)} ${icon('arrow')}</button></div>`:`<div class="flow-next all-done"><div><span class="caps">All steps complete</span><strong>${a?html(a.title):'Assessment'} is finished</strong><p>You can still download the CSV, print reports${STUDENT_EMAIL?' or e-mail feedback to students':''} from Results.</p></div><button class="btn outline" data-action="go-results">${icon('chart')} View results</button></div>`;
 if(compact)return `<section class="card flow-card compact">${strip}${next?`<div class="flow-next-inline"><span>Next: <strong>${html(next.cta)}</strong></span><button class="btn small primary" data-action="${next.action}">Go ${icon('arrow',14)}</button></div>`:''}</section>`;
 return `<section class="card flow-card"><div class="flow-head"><div><h2>Your progress</h2><p>${a?`Assessment: <strong>${html(a.title)}</strong>`:'Follow these steps to mark your first assessment.'}</p></div>${state.assessments.length>1?`<select class="control" data-select-assessment aria-label="Choose assessment" style="max-width:260px">${state.assessments.map(x=>`<option value="${x.id}" ${a&&x.id===a.id?'selected':''}>${html(x.title)}</option>`).join('')}</select>`:''}</div>${strip}${nextBox}</section>`;
}

/** Uses the loaded logo as the browser-tab icon: drawn to a 64×64 image so every browser shows it (no caching or file-name issues). */
function setFavicon(img){
 let href=img.src;
 try{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const r=Math.min(64/img.naturalWidth,64/img.naturalHeight);const w=img.naturalWidth*r,h=img.naturalHeight*r;g.drawImage(img,(64-w)/2,(64-h)/2,w,h);href=c.toDataURL('image/png')}catch(e){}
 document.querySelectorAll('link[rel~="icon"]').forEach(l=>l.remove());
 const link=document.createElement('link');link.rel='icon';link.type='image/png';link.href=href;document.head.appendChild(link);
}
function renderBrand(){
 const mark=document.getElementById('brand-icon');if(!mark||mark.dataset.ready)return;mark.dataset.ready='1';
 const t=document.querySelector('.brand-title'),sub=document.querySelector('.brand-sub');if(t)t.textContent=BRAND.name;if(sub)sub.textContent=BRAND.tagline;
 if(!BRAND.logo){mark.innerHTML=icon('layers',22);return}
 const img=new Image();img.alt=BRAND.name+' logo';img.decoding='async';
 img.onload=()=>{mark.innerHTML='';mark.classList.add('has-logo');mark.appendChild(img);setFavicon(img)};// the logo also becomes the browser-tab icon
 img.onerror=()=>{mark.innerHTML=icon('layers',22)};// falls back to the icon if the file is missing
 img.src=BRAND.logo;
}

/** Reads the first table of an uploaded .xlsx / .docx / .csv into tab-separated text. */
async function rubricFileToText(file){
 if(file.size>5*1024*1024)throw Error('The file is larger than 5 MB.');
 if(/\.(csv|txt|tsv)$/i.test(file.name))return await file.text();
 if(/\.xls$|\.doc$/i.test(file.name))throw Error('Old .xls / .doc files cannot be read. In Excel or Word choose File → Save As → .xlsx or .docx, then upload again.');
 const parts=await unzipFiles(await file.arrayBuffer()),dp=new DOMParser();
 if(parts['word/document.xml']){
  const doc=dp.parseFromString(parts['word/document.xml'],'application/xml'),tbl=doc.getElementsByTagName('w:tbl')[0];
  if(!tbl)throw Error('No table was found in this Word file. Put the rubric in a table, like the template.');
  return Array.from(tbl.getElementsByTagName('w:tr')).filter(tr=>tr.parentNode===tbl).map(tr=>Array.from(tr.getElementsByTagName('w:tc')).filter(tc=>tc.parentNode===tr).map(tc=>cleanCell(Array.from(tc.getElementsByTagName('w:p')).map(p=>Array.from(p.getElementsByTagName('w:t')).map(t=>t.textContent).join('')).join(' '))).join('\t')).join('\n');
 }
 const sheetName=Object.keys(parts).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]))[0];
 if(!sheetName)throw Error('No worksheet was found in this Excel file.');
 const shared=parts['xl/sharedStrings.xml']?Array.from(dp.parseFromString(parts['xl/sharedStrings.xml'],'application/xml').getElementsByTagName('si')).map(si=>Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join('')):[];
 const sheet=dp.parseFromString(parts[sheetName],'application/xml'),grid=[];
 for(const c of Array.from(sheet.getElementsByTagName('c'))){
  const ref=c.getAttribute('r')||'',m=ref.match(/^([A-Z]+)(\d+)$/);if(!m)continue;
  const colIdx=m[1].split('').reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0)-1,rowIdx=Number(m[2])-1,t=c.getAttribute('t');
  let v='';if(t==='s')v=shared[Number(c.getElementsByTagName('v')[0]?.textContent)]||'';else if(t==='inlineStr')v=Array.from(c.getElementsByTagName('t')).map(x=>x.textContent).join('');else v=c.getElementsByTagName('v')[0]?.textContent||'';
  if(c.getElementsByTagName('f')[0])continue;// skip formulas such as the "Total weight" row
  (grid[rowIdx]=grid[rowIdx]||[])[colIdx]=cleanCell(v);
 }
 return grid.filter(Boolean).map(r=>Array.from(r,x=>x||'').join('\t')).filter(l=>l.replace(/\t/g,'').trim()&&!/^total weight/i.test(l)).join('\n');
}

function parseRubricTable(raw){
 let rows=parseDelimited(raw);if(!rows.length)return null;
 let header=null;
 if(rows[0].length>1&&!Number.isFinite(Number(String(rows[0][1]).replace('%',''))))header=rows.shift();

 const hasGuide=!!header&&/assess|descri|guid|focus|indicator/i.test(header[2]||'');
 const first=hasGuide?3:2;
 const width=Math.max(...rows.map(r=>r.length),header?header.length:0);
 let descCount=Math.min(6,Math.max(0,width-first));
 let max=descCount>=2?descCount-1:5;max=Math.max(SCALE_MIN,Math.min(SCALE_MAX,max));
 const labels=header?header.slice(first,first+max+1).map(h=>String(h||'').replace(/^\s*\d+\s*[-–—:.)]*\s*/,'').replace(/\(\s*\d+\s*\)/,'').trim()):[];
 return {max,labels,criteria:rows.slice(0,40).map(r=>({title:String(r[0]).slice(0,150),weight:round2(Math.max(0,Number(String(r[1]||'').replace('%',''))||0)),guidance:hasGuide?String(r[2]||'').slice(0,400):'',descs:r.slice(first,first+max+1)}))};
}

}

/** Parses text pasted from Excel/Sheets (tab-separated) or a CSV file. Handles quoted cells. */
function parseDelimited(text){
 text=String(text||'').replace(/^﻿/,'');if(!text.trim())return [];
 let firstLine=text.split(/\r?\n/)[0];
 let delim=text.includes('\t')?'\t':(firstLine.includes(';')&&!firstLine.includes(',')?';':',');
 const rows=[];let row=[],cell='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
  else if(ch==='"'&&cell==='')q=true;
  else if(ch===delim){row.push(cell);cell=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
  else cell+=ch}
 row.push(cell);rows.push(row);
 return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(Boolean));
}
function parseRoster(raw,wantGroup){
 const rows=parseDelimited(raw);if(!rows.length)return {people:[],header:false};
 const first=rows[0].map(c=>c.toLowerCase());
 const header=first.some(c=>/(name|nama|matric|student|group|team|kumpulan|e-?mail|^id$|\bid\b|no\.)/.test(c))&&!first.some(c=>c.includes('@'));
 const body=header?rows.slice(1):rows,width=Math.max(...rows.map(r=>r.length));
 let cols={group:-1,name:-1,id:-1,email:-1};
 if(header){
  const used=new Set(),find=re=>{let i=first.findIndex((c,k)=>!used.has(k)&&re.test(c));if(i>=0)used.add(i);return i};
  cols.email=find(/mail/);cols.group=find(/group|team|kumpulan|kump/);cols.id=find(/matric|matrik|student\s*(id|no)|\bid\b/);if(cols.id<0)cols.id=find(/^(no\.?|number)$/);cols.name=find(/name|nama|student/);
  if(cols.name<0)cols.name=first.findIndex((c,k)=>!used.has(k));
 }else{
  for(let k=0;k<width;k++){let vals=body.map(r=>r[k]||'').filter(Boolean);if(vals.length&&vals.filter(v=>v.includes('@')).length/vals.length>0.5){cols.email=k;break}}
  let free=Array.from({length:width},(_,k)=>k).filter(k=>k!==cols.email);
  if(wantGroup){cols.group=free[0]??-1;cols.name=free[1]??-1;cols.id=free[2]??-1}else{cols.name=free[0]??-1;cols.id=free[1]??-1}
  if(wantGroup&&cols.name<0){cols.name=cols.group;cols.group=-1}
 }
 const people=body.map(r=>({group:cols.group>=0?String(r[cols.group]||'').slice(0,180):'',name:cols.name>=0?String(r[cols.name]||'').slice(0,180):'',studentId:cols.id>=0?String(r[cols.id]||'').slice(0,90):'',email:cols.email>=0?String(r[cols.email]||'').trim().toLowerCase().slice(0,180):''})).filter(x=>x.name).slice(0,2000);
 return {people,header,cols};
}
function rosterOptions(){let a=assess();return {mode:isGroup(a)?(document.querySelector('input[name="roster-grouping"]:checked')?.value||'column'):'individual',size:Math.max(2,Math.min(20,Number(getInput('roster-group-size'))||4)),order:getInput('roster-order')||'shuffle',prefix:getInput('roster-prefix')||'Group'}}
function shuffled(list){let x=list.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function chunkGroups(list,size){let n=Math.max(1,Math.round(list.length/size)),groups=Array.from({length:n},()=>[]);list.forEach((p,i)=>groups[i%n].push(p));return groups}
/** Plans the import without changing data, so the preview and the import always agree. */
function planRoster(a,people,opt){
 const plan={groups:[],added:0,duplicates:0,noGroup:0,invalidEmail:people.filter(p=>p.email&&!validEmail(p.email)).length};
 if(!isGroup(a)){
  const seen=new Set(a.participants.map(p=>(p.studentId||p.name).toLowerCase()));
  plan.individuals=people.filter(p=>{let k=(p.studentId||p.name).toLowerCase();if(seen.has(k)){plan.duplicates++;return false}seen.add(k);return true});
  plan.added=plan.individuals.length;return plan;
 }
 const existing=new Set();a.participants.forEach(p=>groupMembers(p).forEach(m=>existing.add((m.studentId||m.name).toLowerCase())));
 const fresh=people.filter(p=>{let k=(p.studentId||p.name).toLowerCase();if(existing.has(k)){plan.duplicates++;return false}existing.add(k);return true});
 if(opt.mode==='auto'){
  const list=opt.order==='shuffle'?shuffled(fresh):fresh,names=new Set(a.participants.map(p=>p.name.toLowerCase()));let n=a.participants.length;
  chunkGroups(list,opt.size).forEach(members=>{if(!members.length)return;let name;do{n++;name=`${opt.prefix} ${n}`}while(names.has(name.toLowerCase()));names.add(name.toLowerCase());plan.groups.push({name,members,isNew:true})});
 }else{
  const map=new Map();
  for(const p of fresh){let g=p.group||'Unassigned';if(!p.group)plan.noGroup++;let k=g.toLowerCase();if(!map.has(k))map.set(k,{name:g,members:[],isNew:!a.participants.some(x=>x.name.toLowerCase()===k)});map.get(k).members.push(p)}
  plan.groups=[...map.values()];
 }
 plan.added=plan.groups.reduce((s,g)=>s+g.members.length,0);return plan;
}
function applyRoster(a,plan){
 const member=p=>({name:p.name,studentId:p.studentId,email:validEmail(p.email)?p.email:'',contribution:100});
 if(!isGroup(a)){for(const p of plan.individuals)a.participants.push({id:id(),name:p.name,studentId:p.studentId,email:validEmail(p.email)?p.email:''});return}
 for(const g of plan.groups){let target=a.participants.find(x=>x.name.toLowerCase()===g.name.toLowerCase());if(!target){target={id:id(),name:g.name,studentId:'',members:[]};a.participants.push(target)}target.members=groupMembers(target).concat(g.members.map(member))}
}

function updateRosterPreview(){

 if(!parsed.people.length){el.innerHTML='Paste your list to see a preview.';if(btn)btn.disabled=true;return}
 let plan=planRoster(a,parsed.people,opt);if(btn)btn.disabled=!plan.added;
 let warn=[];if(plan.duplicates)warn.push(`${plan.duplicates} already on the list (skipped)`);if(STUDENT_EMAIL&&plan.invalidEmail)warn.push(`${plan.invalidEmail} invalid e-mail(s) will be left blank`);if(plan.noGroup)warn.push(`${plan.noGroup} without a group → “Unassigned”`);
 let head=`<div class="preview-summary"><strong>${plan.added} student${plan.added===1?'':'s'} to add</strong>${isGroup(a)?` in <strong>${plan.groups.length} group${plan.groups.length===1?'':'s'}</strong> (${plan.groups.filter(g=>g.isNew).length} new)`:''}${parsed.header?' · header row detected':''}</div>${warn.length?`<div class="notice warn" style="margin:8px 0">${icon('alert')}<span>${html(warn.join(' · '))}</span></div>`:''}`;
 if(isGroup(a))el.innerHTML=head+`<div class="preview-groups">${plan.groups.slice(0,12).map(g=>`<div class="preview-group"><strong>${html(g.name)} <span class="tiny-note">${g.members.length}</span></strong>${g.members.slice(0,6).map(m=>`<span>${html(m.name)}${m.studentId?' · '+html(m.studentId):''}${STUDENT_EMAIL&&m.email?' · '+html(m.email):''}</span>`).join('')}${g.members.length>6?`<span class="tiny-note">+${g.members.length-6} more</span>`:''}</div>`).join('')}${plan.groups.length>12?`<div class="tiny-note">+${plan.groups.length-12} more groups</div>`:''}</div>`;
 else el.innerHTML=head+`<table class="roster-table"><thead><tr><th>#</th><th>Name</th><th>Student ID</th>${STUDENT_EMAIL?'<th>E-mail</th>':''}</tr></thead><tbody>${plan.individuals.slice(0,10).map((p,i)=>`<tr><td>${i+1}</td><td>${html(p.name)}</td><td>${html(p.studentId)}</td>${STUDENT_EMAIL?`<td>${html(p.email)}</td>`:''}</tr>`).join('')}</tbody></table>${plan.individuals.length>10?`<div class="tiny-note">+${plan.individuals.length-10} more</div>`:''}`;

/* ---------- Downloads, CSV and JSON ---------- */
function download(name,content,mime='application/json'){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download=name;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function filename(s){return String(s||'rubric').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,55)||'rubric'}
function downloadRubric(){let t=template();if(!t)return;download(filename(t.name)+'-rubric.json',JSON.stringify({type:'rubric-studio-template',version:2,template:t},null,2));toast('Shareable rubric template downloaded.')}
function downloadBackup(){download('rubric-studio-backup-'+localDate()+'.json',JSON.stringify(state,null,2));toast('Full backup downloaded.')}
function csvEscape(s){let str=String(s??'');if(/^[=+\-@\t\r]/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"'}
function csvText(a){
 let titles=['Assessment','Course','Date','Lecturer','Assessment Type','Marked As','Group','Group Code','Student Name','Student ID',...(STUDENT_EMAIL?['Email']:[]),...a.rubric.criteria.flatMap(c=>[c.title+' (Scale 0–'+scaleMax(a.rubric)+')',c.title+' (Marks / '+marks(c.weight)+')']),'Group / Rubric Mark (/100)','Contribution (%)','Individual Mark (/100)',...(SHOW_GRADES?['Grade','Grade Point','Grade Status']:[]),'Assignment Weightage in Course (%)','Course Contribution (marks)','Course Contribution Maximum (marks)','Criteria Marked','Status','Overall Feedback'];
 let rows=[titles];
 for(let e of studentEntries(a)){let g=a.grades[e.p.id]||{};let scores=a.rubric.criteria.flatMap(c=>{let lv=a.rubric.levels.find(l=>l.id===g.choices?.[c.id]);return lv?[lv.score,marks(weightedPoints(c,lv,a.rubric))]:['','']});
  rows.push([a.title,a.course,a.date,a.lecturer,typeLabel(a),isGroup(a)?'Group (shared mark)':'Individual',isGroup(a)?e.p.name:'',isGroup(a)?e.p.studentId:'',e.name,e.studentId,...(STUDENT_EMAIL?[e.email]:[]),...scores,marks(e.r.percent),isGroup(a)?marks(e.contribution):'',marks(e.individual),...(SHOW_GRADES?[e.grade,e.point,e.gstatus]:[]),e.r.courseWeight===null?'':marks(e.r.courseWeight),e.course===null?'':marks(e.course),e.r.courseWeight===null?'':marks(e.r.courseWeight),`${e.r.answered}/${e.r.count}`,statusText(e.r),g.feedback||''])}
 return '﻿'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
}

function validTemplate(t){if(!t||typeof t.name!=='string'||!Array.isArray(t.levels))return false;let max=scaleMax(t);return max>=SCALE_MIN&&max<=HISTORIC_SCALE_MAX&&t.levels.length===max+1&&t.levels.every(l=>typeof l.id==='string'&&typeof l.label==='string'&&Number.isInteger(l.score)&&l.score>=0&&l.score<=max)&&new Set(t.levels.map(l=>l.id)).size===max+1&&new Set(t.levels.map(l=>l.score)).size===max+1&&t.levels.every((_,i)=>t.levels.some(l=>l.score===i))&&Array.isArray(t.criteria)&&t.criteria.length>=1&&t.criteria.every(c=>typeof c.id==='string'&&typeof c.title==='string'&&Number.isFinite(Number(c.weight))&&Number(c.weight)>=0&&Number(c.weight)<=100&&c.descriptors&&typeof c.descriptors==='object')}
function validLegacyTemplate(t){return t&&typeof t.name==='string'&&Array.isArray(t.levels)&&t.levels.length>=2&&t.levels.every(l=>typeof l.id==='string'&&Number.isFinite(Number(l.pct)))&&Array.isArray(t.criteria)&&t.criteria.length>=1&&t.criteria.every(c=>typeof c.id==='string'&&Number.isFinite(Number(c.max))&&Number(c.max)>0)}
function sanitizeTemplate(t){let c=clone(t);c.levels.sort((a,b)=>a.score-b.score);c.id=id();c.name=String(c.name).slice(0,120);c.course=String(c.course||'').slice(0,120);c.description=String(c.description||'');c.updatedAt=new Date().toISOString();return c}
async function uploadJSON(file,mode){if(!file)return;try{if(file.size>12*1024*1024)throw Error('File exceeds 12 MB.');let data=JSON.parse(await file.text());if(mode==='rubric'){let t=data.type==='rubric-studio-template'?data.template:data;if(validLegacyTemplate(t))t=migrateRubric(t).rubric;if(!validTemplate(t))throw Error('This is not a valid Rubric Studio template JSON file.');t=sanitizeTemplate(t);state.templates.push(t);state.selectedTemplateId=t.id;save();navigate('templates');toast('Shared rubric imported successfully.')}else{if(isLegacyState(data)){if(!data.templates.every(validLegacyTemplate)||!data.assessments.every(a=>validLegacyTemplate(a.rubric)))throw Error('Invalid legacy backup.');data=migrateState(data)}if(!isState(data)||!data.templates.every(validTemplate)||!data.assessments.every(a=>a&&a.rubric&&validTemplate(a.rubric)&&Array.isArray(a.participants)&&a.grades&&typeof a.grades==='object'))throw Error('This is not a valid Rubric Studio backup.');if(!confirm('Replace ALL templates, assessments and marks in this browser with this backup? Export a backup first.'))return;state=normaliseState(data);save();navigate('dashboard');toast('Full backup restored.')}}catch(e){alert('Import failed: '+e.message)}}

/* ---------- 9. Reports & e-mail ---------- */
const REPORT_CSS='body{font-family:Arial,Helvetica,sans-serif;color:#111;font-size:11pt;line-height:1.4;margin:0}h1{font-size:16pt;margin:0 0 4mm;color:#14213a}h2{font-size:12pt;margin:5mm 0 2mm;color:#14213a}table{width:100%;border-collapse:collapse;margin:3mm 0;font-size:9.5pt}th,td{border:1px solid #999;padding:5px 7px;text-align:left;vertical-align:top}th{background:#eee}.print-meta div{display:inline-block;width:49%;margin-bottom:2px;vertical-align:top}.print-meta{margin-bottom:4mm}.print-total{font-size:13pt;font-weight:bold;margin-top:4mm}.print-feedback{white-space:pre-wrap;overflow-wrap:break-word}.print-note{font-size:9pt;color:#555;margin:2mm 0 0}.print-break{page-break-before:always;break-before:page}.print-stats{font-size:10pt;margin:2mm 0 3mm;color:#333}';
function reportDocument(title,body){return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${html(title)}</title><style>${REPORT_CSS}</style></head><body>${body}</body></html>`}
function participantReportBody(a,p,opt={}){
 let g=a.grades[p.id]||{},r=calculate(a,p.id),member=opt.member||null,forStudent=!!opt.forStudent,includeCourse=opt.includeCourse!==false,showGrade=forStudent?opt.showGrade!==false:true;
 let contribution=member?validContribution(member.contribution):100,individual=Math.min(100,r.percent*contribution/100),course=r.courseWeight===null?null:individual*r.courseWeight/100;
 let rows=a.rubric.criteria.map((c,i)=>{let l=a.rubric.levels.find(x=>x.id===g.choices?.[c.id]);return `<tr><td>${i+1}. ${html(c.title)}</td><td>${l?l.score+' / '+scaleMax(a.rubric)+' · '+html(l.label):'Not selected'}</td><td>${marks(c.weight)}%</td><td>${l?marks(weightedPoints(c,l,a.rubric)):'—'} / ${marks(c.weight)}</td><td>${html(g.notes?.[c.id]||'')}</td></tr>`}).join('');
 let showContrib=!forStudent&&groupMembers(p).some(m=>validContribution(m.contribution)!==100);
 let roster=isGroup(a)?`<h2>Group members</h2><table><thead><tr><th>No.</th><th>Student name</th><th>Student ID</th>${showContrib?'<th>Contribution</th><th>Individual mark</th>':''}</tr></thead><tbody>${groupMembers(p).map((m,i)=>{let c=validContribution(m.contribution);return `<tr><td>${i+1}</td><td>${html(m.name)}</td><td>${html(m.studentId||'—')}</td>${showContrib?`<td>${marks(c)}%</td><td>${marks(Math.min(100,r.percent*c/100))}</td>`:''}</tr>`}).join('')||'<tr><td colspan="3">No student names entered</td></tr>'}</tbody></table>`:'';
 let gradeText=SHOW_GRADES&&r.complete&&showGrade?` · Grade ${html(gradeDetail(member?individual:r.percent))}`:'';
 return `<h1>${isGroup(a)?'Group Assignment Assessment Report':'Individual Assessment Report'}</h1><div class="print-meta"><div><strong>Assessment:</strong> ${html(a.title)}</div><div><strong>Course:</strong> ${html(a.course)}</div><div><strong>Assessment type:</strong> ${html(typeLabel(a))}</div><div><strong>${isGroup(a)?'Group':'Student'}:</strong> ${html(p.name)}</div><div><strong>${isGroup(a)?'Group code':'Student ID'}:</strong> ${html(p.studentId||'—')}</div>${member?`<div><strong>Student:</strong> ${html(member.name)}${member.studentId?' ('+html(member.studentId)+')':''}</div>`:''}<div><strong>Lecturer / marker:</strong> ${html(a.lecturer)}</div><div><strong>Date:</strong> ${dateLabel(a.date)}</div><div><strong>Rubric:</strong> ${html(a.rubric.name)} (scale 0–${scaleMax(a.rubric)})</div><div><strong>Status:</strong> ${r.complete?'Complete':'Incomplete'}</div>${includeCourse?`<div><strong>Assignment course weight:</strong> ${r.courseWeight===null?'Not set':pct(r.courseWeight)}</div>`:''}</div>${roster}<h2>Rubric marks</h2><table><thead><tr><th>Criterion</th><th>Level awarded</th><th>Weight</th><th>Marks</th><th>Comment</th></tr></thead><tbody>${rows}</tbody></table>
 <div class="print-total">${isGroup(a)?'Group mark':'Rubric mark'}: ${marks(r.percent)} / 100${member&&contribution!==100?'':gradeText}${member&&contribution!==100?`<br>Individual mark (${marks(contribution)}% contribution): ${marks(individual)} / 100${gradeText}`:''}${includeCourse?`<br>Course contribution: ${course===null?'Not set':`${marks(course)} / ${marks(r.courseWeight)}`}`:''}${r.complete?'':' — PROVISIONAL'}</div>
 <h2>Overall feedback</h2><div class="print-feedback">${html(g.feedback||'No feedback entered.')}</div>
 <p class="print-note">Marks = (level score ÷ ${scaleMax(a.rubric)}) × criterion weight; criterion weights total 100.${isGroup(a)?' The group mark is shared by members; an individual mark reflects any contribution adjustment.':''}${includeCourse?' Course contribution = (mark ÷ 100) × assignment course weightage.':''}${forStudent?' Marks are provisional until confirmed through the official results process.':''}</p>`;
}
function summaryReportBody(a){
 let s=assessmentStats(a);
 let rows=a.participants.map((p,i)=>{let r=calculate(a,p.id);return `<tr><td>${i+1}</td><td>${html(p.name)}${isGroup(a)&&p.studentId?'<br><small>'+html(p.studentId)+'</small>':''}</td><td>${isGroup(a)?groupMembers(p).map(m=>{let c=validContribution(m.contribution);return `${html(m.name)}${m.studentId?' ('+html(m.studentId)+')':''}${c!==100?` — ${marks(c)}% → ${marks(Math.min(100,r.percent*c/100))}`:''}`}).join('<br>')||'—':html(p.studentId)}</td><td>${marks(r.percent)} / 100</td>${SHOW_GRADES?`<td>${r.complete?html(gradeDetail(r.percent)):'—'}</td>`:''}<td>${r.courseWeight===null?'Not set':`${marks(r.courseContribution)} / ${marks(r.courseWeight)}`}</td><td>${statusText(r)}</td></tr>`}).join('');
 return `<h1>Assessment Results Summary</h1><div class="print-meta"><div><strong>Assessment:</strong> ${html(a.title)}</div><div><strong>Assessment type:</strong> ${html(typeLabel(a))}</div><div><strong>Course:</strong> ${html(a.course)}</div><div><strong>Lecturer:</strong> ${html(a.lecturer)}</div><div><strong>Date:</strong> ${dateLabel(a.date)}</div><div><strong>Rubric:</strong> ${html(a.rubric.name)}</div><div><strong>Marking scale:</strong> 0–${scaleMax(a.rubric)}</div><div><strong>Assignment course weightage:</strong> ${getAssessmentWeight(a)===null?'Not set':pct(getAssessmentWeight(a))}</div><div><strong>Status:</strong> ${a.locked?'Finalised':'Not finalised'}</div></div>
 <div class="print-stats"><strong>Statistics (individual marks, fully marked only):</strong> n = ${s.n} of ${s.total} · mean ${s.n?marks(s.mean):'—'} · median ${s.n?marks(s.median):'—'} · highest ${s.n?marks(s.max):'—'} · lowest ${s.n?marks(s.min):'—'} · pass (≥ ${marks(state.settings.passMark)}) ${s.n?pct(s.pass/s.n*100):'—'}${SHOW_GRADES?`<br><strong>Grades:</strong> ${s.dist.map(d=>`${html(d.grade)}: ${d.count}`).join(' · ')}${s.statuses.length?`<br><strong>Status:</strong> ${s.statuses.map(x=>`${html(x.status)}: ${x.count}`).join(' · ')} · average grade point ${s.avgPoint===null?'—':s.avgPoint.toFixed(2)}`:''}`:''}</div>
 <table><thead><tr><th>No.</th><th>${isGroup(a)?'Group':'Student'}</th><th>${isGroup(a)?'Members (ID) — individual adjustments':'Student ID'}</th><th>${isGroup(a)?'Group mark':'Mark'}</th>${SHOW_GRADES?'<th>Grade</th>':''}<th>Course contribution</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="7">No entries</td></tr>'}</tbody></table><p class="print-note">${SHOW_GRADES?'Grades use the grade scale set in Rubric Studio. ':''}Incomplete rows show provisional scores. Verify completion before using in formal results.</p>`;
}
function allReportsBody(a){return a.participants.map((p,i)=>`<section class="${i?'print-break':''}">${participantReportBody(a,p)}</section>`).join('')||'<p>No entries.</p>'}
function printHtml(body){document.getElementById('print-area').innerHTML=body;window.print()}

 openModal('Send results to me','Results are sent from your own Google account as attachments.',`${incomplete?`<div class="notice warn" style="margin-bottom:14px">${icon('alert')}<span>${incomplete} ${pluralLabel(a)} not fully marked — their scores will be marked provisional.</span></div>`:''}
 <div class="form-grid"><div class="field full"><label for="email-to">Send to</label><input class="control" id="email-to" value="${html(cloudUserEmail)}" placeholder="you@university.edu.my"><div class="tiny-note">Your account e-mail is filled in. Add more addresses separated by commas (e.g. programme coordinator) — max. 10.</div></div>

async function sendResultsEmail(){
 let a=assess(),btn=document.getElementById('send-results-btn'),status=document.getElementById('email-status');
 let files={},base=filename(a.title);
 if(getChecked('att-summary'))files.summaryHtml={name:base+'-summary.pdf',html:reportDocument('Results summary',summaryReportBody(a))};
 if(getChecked('att-reports'))files.reportsHtml={name:base+'-feedback-reports.pdf',html:reportDocument('Feedback reports',allReportsBody(a))};
 if(getChecked('att-csv'))files.csv={name:base+'-results.csv',content:csvText(a)};
 if(!Object.keys(files).length){alert('Choose at least one attachment.');return}
 let to=getInput('email-to');if(!to){alert('Enter at least one e-mail address.');return}
 btn.disabled=true;status.className='send-status busy';status.textContent='Creating PDFs and sending… this can take up to a minute.';
 try{
  let done=a.participants.filter(p=>calculate(a,p.id).complete).length;
  let res=await run('emailResults',{to,subject:getInput('email-subject'),message:getInput('email-note'),title:a.title,meta:`${a.course||'Course not set'} · ${a.participants.length} ${pluralLabel(a)} · ${done} fully marked · ${a.locked?'Finalised':'Not finalised'}`,files});
  a.resultsEmailedAt=new Date().toISOString();save();closeModal();render();toast(`Results e-mailed to ${res.sentTo.join(', ')}.`);

function feedbackRecipients(a){return studentEntries(a).filter(e=>e.m||!isGroup(a)).map(e=>({...e,ok:validEmail(e.email),sent:(a.feedbackSent||{})[e.key]||''}))}
function modalEmailStudents(){
 let a=assess();if(!a)return;let list=feedbackRecipients(a),resend=getChecked('fb-resend');
 let ready=list.filter(x=>x.ok&&x.r.complete&&(!x.sent||resend));
 const st=x=>!x.r.complete?'<span class="pill">Not fully marked</span>':!x.ok?'<span class="pill red">No valid e-mail</span>':x.sent?`<span class="pill green">Sent ${html(dateLabel(x.sent.slice(0,10)))}</span>`:'<span class="pill orange">Ready</span>';
 openModal('E-mail feedback to students','Each student receives their own report from your Google account. Replies come back to you.',`${a.locked?'':`<div class="notice warn" style="margin-bottom:14px">${icon('alert')}<span><strong>Tip:</strong> finalise marks (Marking Workspace → Finalise marks) before releasing feedback, so nothing changes after students receive it.</span></div>`}
 <div class="form-grid"><div class="field full"><label for="fb-subject">Subject</label><input class="control" id="fb-subject" maxlength="200" value="${html(`Feedback: ${a.title}${a.course?' ('+a.course+')':''}`)}"></div>

 <div class="preview-summary" style="margin:6px 0 10px"><strong>${ready.length} e-mail${ready.length===1?'':'s'} ready to send</strong> · ${list.filter(x=>!x.ok).length} without a valid e-mail · ${list.filter(x=>!x.r.complete).length} not fully marked</div>
 <div class="table-wrap recipients"><table class="roster-table"><thead><tr><th>Student</th>${isGroup(a)?'<th>Group</th>':''}<th>E-mail</th><th>Status</th></tr></thead><tbody>${list.map(x=>`<tr><td>${html(x.name||'—')}<div class="tiny-note">${html(x.studentId||'')}</div></td>${isGroup(a)?`<td>${html(x.p.name)}</td>`:''}<td>${html(x.email||'—')}</td><td>${st(x)}</td></tr>`).join('')||'<tr><td colspan="4">No students on this list.</td></tr>'}</tbody></table></div>
 <div class="tiny-note" style="margin-top:8px">Missing e-mails? Add them via <em>Edit group & members</em> or re-import the class list with an E-mail column. Google limits daily e-mails (about 100 recipients/day for personal accounts; more for Workspace).</div><div id="fb-status" class="send-status"></div>`,

async function sendStudentEmails(){
 let a=assess(),resend=getChecked('fb-resend'),list=feedbackRecipients(a).filter(x=>x.ok&&x.r.complete&&(!x.sent||resend));
 if(!list.length)return;
 if(!confirm(`Send individual feedback e-mails to ${list.length} student${list.length===1?'':'s'} from your Google account?`))return;
 let subject=getInput('fb-subject'),showGrade=getChecked('fb-grade'),includeCourse=getChecked('fb-course'),attachPdf=getChecked('fb-pdf'),lecturer=a.lecturer||state.lecturer||'Your lecturer';
 let btn=document.getElementById('send-fb-btn'),status=document.getElementById('fb-status');btn.disabled=true;
 let sent=0,failed=[];a.feedbackSent=a.feedbackSent||{};
 const items=list.map(x=>({key:x.key,to:x.email,subject,pdfName:filename(a.title+' '+(x.name||x.p.name))+'.pdf',html:reportDocument('Feedback',`<p>Dear ${html(x.name||x.p.name)},</p><p>Your feedback for <strong>${html(a.title)}</strong>${a.course?' ('+html(a.course)+')':''} is below.</p>${participantReportBody(a,x.p,{member:x.m,forStudent:true,includeCourse,showGrade})}<p>If you have questions about your feedback, reply to this e-mail.</p><p>Regards,<br>${html(lecturer)}</p>`)}));
 try{
  for(let i=0;i<items.length;i+=20){
   status.className='send-status busy';status.textContent=`Sending ${Math.min(i+20,items.length)} of ${items.length}…`;
   let res=await run('sendStudentFeedback',{items:items.slice(i,i+20),attachPdf,senderName:lecturer});
   let now=new Date().toISOString();res.sent.forEach(s=>{a.feedbackSent[s.key]=now;sent++});failed=failed.concat(res.failed);save();
  }
  status.className=failed.length?'send-status error':'send-status ok';
  status.textContent=`${sent} sent.`+(failed.length?` ${failed.length} failed: `+failed.slice(0,5).map(f=>`${f.to} (${f.error})`).join('; '):'');
  toast(`${sent} feedback e-mail${sent===1?'':'s'} sent.`);
  if(!failed.length){closeModal();render()}
 }catch(e){status.className='send-status error';status.textContent=`${sent} sent before an error: `+String(e&&e.message||e);btn.disabled=false;save()}
}

function onClick(e){let b=e.target.closest('[data-action]');if(!b||b.disabled)return;if(!state){return}let action=b.dataset.action,t=template(),a=assess();switch(action){

 case 'finalise-flow':{if(!a)break;if(view!=='marking')navigate('marking');if(!a.locked){let inc=a.participants.filter(p=>!calculate(a,p.id).complete).length;if(!confirm(`Finalise marks for "${a.title}"?${inc?`\n\n${inc} ${pluralLabel(a)} are not fully marked.`:''}\n\nMarks and feedback become read-only until you unlock.`))break;a.locked=true;a.lockedAt=new Date().toISOString();save();render();toast(RESULTS_EMAIL?'Marks finalised. Next: e-mail the results.':'Marks finalised. Next: download the results.')}break}

 case 'create-pasted-rubric':{let p=parseRubricTable(getInput('paste-rubric-input'));if(!p){alert('Upload a filled template (or paste a rubric table) first.');return}let name=getInput('paste-rubric-name')||'Imported rubric',levels=starterLevels(p.max);levels.forEach(l=>{let lab=p.labels[p.max-l.score];if(lab)l.label=lab.slice(0,40)});let nt={id:id(),name:name.slice(0,120),course:getInput('paste-rubric-course'),description:'',scaleMax:p.max,levels,criteria:p.criteria.map(c=>({id:id(),title:c.title,weight:c.weight,guidance:c.guidance||'',descriptors:Object.fromEntries(levels.map(l=>[l.id,String(c.descs[p.max-l.score]||'')]))})),updatedAt:new Date().toISOString()};state.templates.push(nt);state.selectedTemplateId=nt.id;save();closeModal();navigate('templates');toast(weightsValid(nt)?'Rubric created from your table.':'Rubric created — weights need balancing to total 100%.');break}
 case 'create-template':{let name=getInput('new-template-name');if(!name){alert('Please enter a rubric name.');return}let course=getInput('new-template-course'),maxScore=Number(getInput('new-template-scale'))||5,lv=starterLevels(maxScore),nt={id:id(),name,course,description:'',scaleMax:maxScore,levels:lv,criteria:[{id:id(),title:'Criterion 1',weight:100,guidance:'',descriptors:Object.fromEntries(lv.map(l=>[l.id,'']))}],updatedAt:new Date().toISOString()};state.templates.push(nt);state.selectedTemplateId=nt.id;save();closeModal();navigate('templates');toast('New rubric created.');break}
 case 'choose-template':state.selectedTemplateId=b.dataset.id;save();render();animateView();break;

 case 'save-group':{if(!isGroup(a))break;let name=getInput('group-name'),code=getInput('group-code');let members=[],seen=new Set();for(const row of document.querySelectorAll('#group-member-rows [data-member-row]')){let nm=row.querySelector('[data-member-name]').value.trim(),sid=row.querySelector('[data-member-id]').value.trim(),em=row.querySelector('[data-member-email]').value.trim().toLowerCase(),cv=row.querySelector('[data-member-contribution]').value;if(!nm&&(sid||em)){alert('Please add a student name for '+(sid||em)+'.');return}if(!nm)continue;if(em&&!validEmail(em)){alert('Invalid e-mail for '+nm+': '+em);return}let c=Number(cv);if(cv!==''&&(!Number.isFinite(c)||c<0||c>150)){alert('Contribution for '+nm+' must be between 0 and 150%.');return}let key=(sid||nm).toLowerCase();if(seen.has(key)){alert('Duplicate student in this group: '+nm);return}seen.add(key);members.push({name:nm.slice(0,180),studentId:sid.slice(0,90),email:em,contribution:validContribution(cv)})}if(!name){alert('Please enter a group name or number.');return}if(a.participants.some(p=>p.name.toLowerCase()===name.toLowerCase()&&p.id!==b.dataset.id)){alert('A group with this name already exists. Choose a different name.');return}let p=a.participants.find(x=>x.id===b.dataset.id);if(p){p.name=name.slice(0,180);p.studentId=code.slice(0,90);p.members=members}else{p={id:id(),name:name.slice(0,180),studentId:code.slice(0,90),members};a.participants.push(p)}state.activeParticipantId=p.id;save();closeModal();render();toast('Group and students saved.');break}

<script>
/* Standalone overrides: e-mail via the lecturer's own mail app, backup reminders, device data controls. */
(function(){
 const DAY=864e5;
 const mailto=(to,subject,body)=>`mailto:${encodeURIComponent(to||'').replace(/%40/g,'@').replace(/%2C/gi,',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
 const openMail=href=>{let el=document.createElement('a');el.href=href;el.rel='noopener';document.body.appendChild(el);el.click();el.remove()};
 const myEmail=()=>state.settings.myEmail||'';
 const lineMark=v=>marks(v);

 /* ---- Results to the lecturer ---- */

  let a=assess();if(!a)return;let incomplete=a.participants.filter(p=>!calculate(a,p.id).complete).length;
  openModal('Send results to yourself','Two steps: download the files, then open your e-mail app and attach them.',`${incomplete?`<div class="notice warn" style="margin-bottom:14px">${icon('alert')}<span>${incomplete} ${incomplete===1?subjectLabel(a).toLowerCase():pluralLabel(a)} not fully marked — their scores are provisional.</span></div>`:''}
  <div class="import-step"><span class="step-num">1</span><div style="flex:1"><div class="field-label" style="margin-bottom:8px">Save the files</div><div class="quick-grid">
   <button class="quick-btn" data-sa="csv">${icon('download',20)}<span>Download marks (CSV for Excel)</span></button>
   <button class="quick-btn" data-sa="summary">${icon('printer',20)}<span>Summary → Save as PDF</span></button>
   <button class="quick-btn" data-sa="reports">${icon('printer',20)}<span>Feedback reports → Save as PDF</span></button>
   <button class="quick-btn" data-sa="backup">${icon('storage',20)}<span>Full backup (JSON)</span></button></div>
   <div class="tiny-note" style="margin-top:6px">For PDFs, choose <strong>Save as PDF</strong> as the printer in the print window.</div></div></div>
  <div class="import-step"><span class="step-num">2</span><div style="flex:1" class="form-grid"><div class="field full"><label for="sa-to">Send to</label><input class="control" id="sa-to" type="email" value="${html(myEmail())}" placeholder="you@university.edu.my"><div class="tiny-note">Saved for next time. Separate several addresses with commas.</div></div><div class="field full"><label for="sa-subject">Subject</label><input class="control" id="sa-subject" value="${html(`Results — ${a.title}${a.course?' ('+a.course+')':''}`)}"></div></div></div>`,
  `<button class="btn outline" data-action="close-modal">Close</button><button class="btn primary" data-sa="open-mail">${icon('mail')} Open e-mail app</button>`);
 };
 function resultsBody(a){
  let s=assessmentStats(a);
  let lines=[`${a.title}${a.course?' ('+a.course+')':''}`,`Lecturer: ${a.lecturer||'-'}  ·  Date: ${dateLabel(a.date)}  ·  ${a.locked?'Finalised':'Not finalised'}`,'',
   `Students fully marked: ${s.n}/${s.total}`,`Average ${s.n?lineMark(s.mean):'-'} · Median ${s.n?lineMark(s.median):'-'} · Highest ${s.n?lineMark(s.max):'-'} · Lowest ${s.n?lineMark(s.min):'-'}`,`Grades: ${s.dist.map(d=>d.grade+' '+d.count).join(', ')}`,'',
   ...a.participants.slice(0,40).map(p=>{let r=calculate(a,p.id);return `- ${p.name}: ${lineMark(r.percent)}/100${r.complete?' ('+gradeFor(r.percent)+')':' (incomplete)'}`}),
   a.participants.length>40?`…and ${a.participants.length-40} more (see attached CSV)`:'','','Attached: marks CSV, summary PDF, feedback reports PDF.'];
  return lines.join('\n');
 }
 document.addEventListener('click',e=>{
  const b=e.target.closest('[data-sa]');if(!b)return;const a=assess();if(!a)return;

   case 'student-mail':{let x=feedbackRecipients(a).find(r=>r.key===b.dataset.key);if(!x)break;let body=studentText(a,x,getChecked('fb-grade'),getChecked('fb-course'));openMail(mailto(x.email,getInput('fb-subject'),body));a.feedbackSent=a.feedbackSent||{};a.feedbackSent[x.key]=new Date().toISOString();save();let cell=b.closest('tr')?.querySelector('[data-status]');if(cell)cell.innerHTML='<span class="pill green">Opened</span>';break}
   case 'student-copy':{let x=feedbackRecipients(a).find(r=>r.key===b.dataset.key);if(!x)break;let txt=studentText(a,x,getChecked('fb-grade'),getChecked('fb-course'));navigator.clipboard?.writeText(txt).then(()=>toast('Feedback copied — paste it into your e-mail.'),()=>alert(txt));break}
  }

 /* ---- Feedback to students (one e-mail each, from the lecturer's mail app) ---- */
 function studentText(a,x,showGrade,includeCourse){
  let g=a.grades[x.p.id]||{},r=x.r,c=x.contribution,ind=x.individual;
  let out=[`Dear ${x.name||x.p.name},`,'',`Your feedback for ${a.title}${a.course?' ('+a.course+')':''}:`,''];
  a.rubric.criteria.forEach((cr,i)=>{let l=a.rubric.levels.find(v=>v.id===g.choices?.[cr.id]);out.push(`${i+1}. ${cr.title}: ${l?`${l.label} (${l.score}/${scaleMax(a.rubric)}) — ${lineMark(weightedPoints(cr,l,a.rubric))}/${lineMark(cr.weight)}`:'not marked'}`);if(g.notes?.[cr.id])out.push(`   ${g.notes[cr.id]}`)});
  out.push('',`${isGroup(a)?'Group mark':'Mark'}: ${lineMark(r.percent)}/100`);
  if(isGroup(a)&&c!==100)out.push(`Your individual mark (${lineMark(c)}% contribution): ${lineMark(ind)}/100`);
  if(showGrade&&r.complete)out.push(`Grade: ${gradeFor(isGroup(a)?ind:r.percent)}`);
  if(includeCourse&&x.course!==null)out.push(`Course contribution: ${lineMark(x.course)}/${lineMark(r.courseWeight)}`);
  if(g.feedback)out.push('','Overall feedback:',g.feedback);
  out.push('','Marks are provisional until confirmed through the official results process.','',`Regards,`,a.lecturer||state.lecturer||'');
  let text=out.join('\n');return text.length>1800?text.slice(0,1780)+'\n…(shortened)':text;
 }
 modalEmailStudents=function(){
  let a=assess();if(!a)return;let list=feedbackRecipients(a);
  const ready=x=>x.ok&&x.r.complete;
  openModal('E-mail feedback to students','Each button opens a pre-written e-mail in your mail app for one student.',`${a.locked?'':`<div class="notice warn" style="margin-bottom:14px">${icon('alert')}<span><strong>Tip:</strong> finalise marks before releasing feedback.</span></div>`}
  <div class="form-grid"><div class="field full"><label for="fb-subject">Subject</label><input class="control" id="fb-subject" value="${html(`Feedback: ${a.title}${a.course?' ('+a.course+')':''}`)}"></div><div class="field full"><span class="field-label">Include</span><label class="check-line"><input type="checkbox" id="fb-grade" ${state.settings.showGradeToStudents!==false?'checked':''}> <span>Letter grade</span></label><label class="check-line"><input type="checkbox" id="fb-course" checked> <span>Course contribution marks</span></label></div></div>
  <div class="preview-summary" style="margin:6px 0 10px"><strong>${list.filter(ready).length} ready</strong> · ${list.filter(x=>!x.ok).length} without a valid e-mail · ${list.filter(x=>!x.r.complete).length} not fully marked</div>
  <div class="table-wrap recipients"><table class="roster-table"><thead><tr><th>Student</th><th>E-mail</th><th>Status</th><th></th></tr></thead><tbody>${list.map(x=>`<tr><td>${html(x.name||'—')}<div class="tiny-note">${html(isGroup(a)?x.p.name:x.studentId||'')}</div></td><td>${html(x.email||'—')}</td><td data-status>${!x.r.complete?'<span class="pill">Not fully marked</span>':!x.ok?'<span class="pill red">No e-mail</span>':x.sent?`<span class="pill green">Opened ${html(dateLabel(x.sent.slice(0,10)))}</span>`:'<span class="pill orange">Ready</span>'}</td><td style="white-space:nowrap">${ready(x)?`<button class="btn small primary" data-sa="student-mail" data-key="${html(x.key)}">${icon('mail',14)} E-mail</button> `:''}${x.r.complete?`<button class="btn small outline" data-sa="student-copy" data-key="${html(x.key)}" title="Copy feedback text">${icon('copy',14)}</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4">No students on this list.</td></tr>'}</tbody></table></div>
  <div class="tiny-note" style="margin-top:8px">Your mail app opens with the text filled in; press Send there. Use <em>Print all feedback reports</em> if you prefer to attach PDFs.</div>`,`<button class="btn primary" data-action="close-modal">Done</button>`,true);
 };

 /* ---- Backups, device storage, privacy ---- */
 const origBackup=downloadBackup;
 downloadBackup=function(){state.lastBackupAt=new Date().toISOString();origBackup();save()};
 function backupBanner(){
  if(!state.assessments.some(hasAssessmentMarks))return '';
  let last=state.lastBackupAt?new Date(state.lastBackupAt):null,days=last?Math.floor((Date.now()-last)/DAY):null;
  if(last&&days<7)return '';
  return `<div class="notice warn" style="margin-bottom:16px;align-items:center">${icon('alert')}<span style="flex:1"><strong>${last?`Last backup ${days} days ago.`:'No backup yet.'}</strong> Your marks are stored only in this browser. Download a backup to keep them safe.</span><button class="btn small primary" data-action="export-backup">${icon('download')} Back up now</button></div>`;
 }
 const origDash=renderDashboard;renderDashboard=function(){return (window.RS_STORAGE_OK()?'':`<div class="notice warn" style="margin-bottom:16px">${icon('alert')}<span><strong>This browser is blocking storage</strong> (private window or strict settings). Your work will be lost when you close the tab — download a backup before leaving.</span></div>`)+backupBanner()+origDash()};
 const origSettings=renderSettings;
 renderSettings=function(){
  return origSettings()+`<div class="section-heading"><div><h2>This device</h2><p>Where your data lives in the web version</p></div></div><div class="backup-grid"><section class="card backup-block"><div class="iconbox">${icon('lock')}</div><h3>Remove data from this device</h3><p>Using a shared or lab computer? Download a backup, then remove everything from this browser. Restore the backup on your own device.</p><button class="btn danger" data-sa-clear>${icon('trash')} Remove from this device</button></section></div>`;
 };
 document.addEventListener('change',e=>{if(e.target.matches('[data-my-email]')){let v=e.target.value.trim().toLowerCase();if(v&&!validEmail(v)){alert('Please enter a valid e-mail address.');return}state.settings.myEmail=v;save();toast('E-mail saved.')}});
 document.addEventListener('click',e=>{if(!e.target.closest('[data-sa-clear]'))return;if(!confirm('Remove ALL rubrics, class lists and marks from this browser? Download a backup first — this cannot be undone.'))return;try{localStorage.removeItem(window.RS_STORAGE_KEY)}catch(x){}cloudDirty=false;cloudReady=false;location.reload()});
 window.addEventListener('storage',e=>{if(e.key===window.RS_STORAGE_KEY&&cloudReady){cloudBlocked=true;setCloudStatus('Changed in another tab — reload','error')}});
 // Write immediately when the tab is closed or hidden, so the last click is never lost.
 window.addEventListener('pagehide',()=>{if(!cloudReady||cloudBlocked||!cloudDirty)return;try{localStorage.setItem(window.RS_STORAGE_KEY,JSON.stringify({revision:cloudRevision+1,json:JSON.stringify(state),savedAt:new Date().toISOString()}));cloudRevision++;cloudDirty=false}catch(x){}});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&cloudDirty)flushCloudSave()});
})();

</script>
